<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Apps</title>
    <style>
        body {
            margin: 0;
            padding: 40px 20px;
            background: linear-gradient(to bottom, #2b2b52, #6a5acd, #b08d9e); 
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .app-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr); 
            gap: 25px 15px; 
            width: 100%;
            max-width: 350px;
        }

        .app-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none; 
            transition: transform 0.2s;
        }

        .app-item:hover {
            transform: scale(1.05); 
        }

        .app-item img {
            width: 70px;
            height: 70px;
            border-radius: 16px; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.3); 
            margin-bottom: 8px;
            background-color: white; 
            object-fit: cover; 
        }

        .app-item span {
            color: white;
            font-size: 13px;
            text-align: center;
            font-weight: 500;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5); 
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- ၁။ Facebook -->
        <a href="https://www.facebook.com/" target="_blank" class="app-item">
            <img src="https://upload.wikimedia.org/wikipedia/commons/b/b9/2023_Facebook_icon.svg" alt="Facebook">
            <span>Facebook</span>
        </a>

        <!-- ၂။ Messenger -->
        <a href="https://www.facebook.com/messages" target="_blank" class="app-item">
            <img src="https://upload.wikimedia.org/wikipedia/commons/b/be/Facebook_Messenger_logo_2020.svg" alt="Messenger">
            <span>Messenger</span>
        </a>

        <!-- ၃။ Chrome -->
        <a href="https://www.google.com/" target="_blank" class="app-item">
            <img src="https://upload.wikimedia.org/wikipedia/commons/e/e1/Google_Chrome_icon_%28February_2022%29.svg" alt="Chrome">
            <span>Chrome</span>
        </a>

        <!-- ၄။ TikTok -->
       
<a href="https://m.tiktok.com/" target="_blank" class="app-item">
    <img src="tiktok.png" alt="TikTok">
    <span>TikTok</span>
</a>

        <!-- ၅။ BeeChat AI (လင့်ခ်အသစ် ချိတ်ဆက်ထားပါတယ်) -->
        <a href="https://mastergyi11.github.io/beeai/" target="_blank" class="app-item">
            <img src="bee_ai.png" alt="BeeChat AI">
            <span>BeeChat AI</span>
        </a>

        <!-- ၆။ Beechat Social (အရင် လင့်ခ်အတိုင်း ထားထားပါတယ်) -->
        <a href="https://mastergyi11.github.io/chat/" target="_blank" class="app-item">
            <img src="bee_social.png" alt="Beechat Social">
            <span>Beechat Social</span>
        </a>

    </div>

</body>
                    </html>
