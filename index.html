<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Apps</title>
    <style>
        body {
            margin: 0;
            padding: 40px 20px;
            background: linear-gradient(to bottom, #2b2b52, #6a5acd, #b08d9e); 
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
            user-select: none; 
            -webkit-user-select: none;
            /* စာမျက်နှာတစ်ခုလုံးမှာ ဖိထားရင် စာသားတွေ ရွေးမိတာမျိုး ကာကွယ်ရန် */
        }

        .app-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr); 
            gap: 25px 15px; 
            width: 100%;
            max-width: 350px;
        }

        .app-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none; 
            transition: transform 0.2s;
            cursor: grab; 
        }

        .app-item:active {
            cursor: grabbing;
            transform: scale(1.1); 
        }

        .app-item img {
            width: 70px;
            height: 70px;
            border-radius: 16px; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.3); 
            margin-bottom: 8px;
            background-color: white; 
            object-fit: cover; 
            /* ဒီအချက်က အရေးကြီးဆုံးပါ။ ပုံကို ဖိရင် Menu မတက်အောင် ပိတ်ထားတာပါ */
            pointer-events: none; 
            -webkit-touch-callout: none; /* iPhone တွေမှာ ပုံဖိရင် Menu မတက်အောင် */
        }

        .app-item span {
            color: white;
            font-size: 13px;
            text-align: center;
            font-weight: 500;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5); 
            /* စာသားကို ဖိရင်လည်း Menu မတက်အောင် ပိတ်ထားတယ် */
            pointer-events: none; 
        }

        .dragging {
            opacity: 0.5;
            transform: scale(1.1);
        }
    </style>
</head>
<body>

    <div class="app-container" id="appContainer">
        
        <a href="https://www.facebook.com/" target="_blank" class="app-item" draggable="true">
            <img src="https://upload.wikimedia.org/wikipedia/commons/b/b9/2023_Facebook_icon.svg" alt="Facebook">
            <span>Facebook</span>
        </a>

        <a href="https://www.facebook.com/messages" target="_blank" class="app-item" draggable="true">
            <img src="https://upload.wikimedia.org/wikipedia/commons/b/be/Facebook_Messenger_logo_2020.svg" alt="Messenger">
            <span>Messenger</span>
        </a>

        <a href="https://www.google.com/" target="_blank" class="app-item" draggable="true">
            <img src="https://upload.wikimedia.org/wikipedia/commons/e/e1/Google_Chrome_icon_%28February_2022%29.svg" alt="Chrome">
            <span>Chrome</span>
        </a>

        <a href="https://m.tiktok.com/" target="_blank" class="app-item" draggable="true">
            <img src="https://cdn-icons-png.flaticon.com/512/3046/3046125.png" alt="TikTok" style="background-color: black;">
            <span>TikTok</span>
        </a>

        <a href="https://mastergyi11.github.io/beeai/" target="_blank" class="app-item" draggable="true">
            <img src="https://cdn-icons-png.flaticon.com/512/4712/4712035.png" alt="BeeChat AI" style="background-color: black;">
            <span>BeeChat AI</span>
        </a>

        <a href="https://mastergyi11.github.io/chat/" target="_blank" class="app-item" draggable="true">
            <img src="https://cdn-icons-png.flaticon.com/512/1041/1041916.png" alt="Beechat Social" style="background-color: #ffcc00;">
            <span>Beechat Social</span>
        </a>

    </div>

    <script>
        const container = document.getElementById('appContainer');
        const items = document.querySelectorAll('.app-item');

        function saveOrder() {
            const order = Array.from(container.children).map(item => item.getAttribute('href'));
            localStorage.setItem('appOrder', JSON.stringify(order));
        }

        function loadOrder() {
            const savedOrder = JSON.parse(localStorage.getItem('appOrder'));
            if (savedOrder) {
                savedOrder.forEach(href => {
                    const item = container.querySelector(`[href="${href}"]`);
                    if (item) container.appendChild(item);
                });
            }
        }

        loadOrder();

        let draggedItem = null;

        items.forEach(item => {
            item.addEventListener('dragstart', function(e) {
                draggedItem = this;
                setTimeout(() => this.classList.add('dragging'), 0);
            });

            item.addEventListener('dragend', function() {
                setTimeout(() => {
                    this.classList.remove('dragging');
                    draggedItem = null;
                    saveOrder(); 
                }, 0);
            });

            item.addEventListener('dragover', function(e) {
                e.preventDefault(); 
                if (this !== draggedItem) {
                    const rect = this.getBoundingClientRect();
                    const next = (e.clientY - rect.top) / (rect.bottom - rect.top) > 0.5;
                    container.insertBefore(draggedItem, next ? this.nextSibling : this);
                }
            });

            // ဖိဆွဲနေတုန်း လင့်ခ်ထဲ မဝင်သွားအောင် ကာကွယ်ခြင်း
            item.addEventListener('click', function(e) {
                if (this.classList.contains('dragging')) {
                    e.preventDefault();
                }
            });
            
            // ဖုန်းတွေမှာ ဖိထားရင် ပေါ်တတ်တဲ့ Menu ကို ပိတ်ခြင်း
            item.addEventListener('contextmenu', function(e) {
                e.preventDefault();
            });
        });
    </script>
</body>
                </html>
