<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Apps</title>
    <style>
        body {
            margin: 0;
            padding: 70px 20px 20px 20px; 
            background: linear-gradient(to bottom, #2b2b52, #6a5acd, #b08d9e); 
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            user-select: none; 
            -webkit-user-select: none;
            touch-action: none; 
            position: relative;
            overflow: hidden;
        }

        /* Settings ခလုတ် */
        .settings-btn {
            position: fixed;
            top: 25px; 
            right: 20px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            font-size: 22px;
            padding: 8px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 1000;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        /* Settings Panel */
        .settings-panel {
            display: none;
            position: fixed;
            top: 75px;
            right: 20px;
            background: #2b2b52;
            border: 1px solid #6a5acd;
            padding: 20px;
            border-radius: 12px;
            color: white;
            width: 250px;
            z-index: 99;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .settings-panel h3 {
            margin: 0 0 15px 0;
            font-size: 16px;
            text-align: center;
            border-bottom: 1px solid #6a5acd;
            padding-bottom: 10px;
        }

        .control-group {
            margin-bottom: 15px;
        }

        .control-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .control-group input[type="range"] {
            width: 100%;
            cursor: pointer;
        }

        .switch {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }
        
        .switch input {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        /* Apps Grid အပိုင်း */
        .app-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr); 
            gap: 15px 10px; 
            width: 100%;
            max-width: 350px;
            position: relative;
            margin-top: 15px; 
        }

        .app-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none; 
            transition: transform 0.2s;
            cursor: grab; 
            position: relative;
            z-index: 1;
            -webkit-tap-highlight-color: transparent; 
        }

        .app-item:active {
            cursor: grabbing;
        }

        .app-item img {
            width: 60px; 
            height: 60px;
            border-radius: 14px; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.3); 
            margin-bottom: 5px;
            background-color: white; 
            object-fit: cover; 
            pointer-events: none; 
            -webkit-touch-callout: none; 
            transition: width 0.3s, height 0.3s;
        }

        .app-item span {
            color: white;
            font-size: 11px; 
            text-align: center;
            font-weight: 500;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5); 
            pointer-events: none; 
            transition: font-size 0.3s;
        }

        .dragging {
            opacity: 0.5;
            transform: scale(1.1);
            box-shadow: 0 10px 10px rgba(0,0,0,0.5);
            z-index: 10;
        }

        /* Widgets အပိုင်း (နာရီနှင့် ရက်စွဲ) */
        .widgets-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            margin-top: 10px; 
            gap: 3px; 
            z-index: 5;
        }

        /* ရက်စွဲ (Date) ပုံစံ */
        .date-container {
            width: 90%;
            max-width: 280px;
            height: 220px; 
            border-radius: 17px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            border: 2px solid rgba(255, 215, 0, 0.3); 
            background: #1a1a2e; 
        }

        .date-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* နာရီ (Clock) ပုံစံ */
        .clock-container {
            width: 100%;
            max-width: 390px;
            height: 320px; 
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            border: 2px solid rgba(255, 215, 0, 0.3); 
            background: #1a1a2e; 
        }

        .clock-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <button class="settings-btn" onclick="toggleSettings()">⚙️</button>

    <div class="settings-panel" id="settingsPanel">
        <h3>ချိန်ညှိမှုများ</h3>
        
        <div class="control-group">
            <label>အိုင်ကွန် အရွယ်အစား - <span id="iconSizeVal">27</span>px</label>
            <input type="range" id="iconSize" min="10" max="27" value="27" oninput="changeIconSize(this.value)">
        </div>

        <div class="control-group">
            <label>စာသား အရွယ်အစား - <span id="textSizeVal">11</span>px</label>
            <input type="range" id="textSize" min="1" max="9" value="11" oninput="changeTextSize(this.value)">
        </div>

        <div class="switch">
            <label>နေရာရွှေ့မှု မှတ်ထားရန်</label>
            <input type="checkbox" id="saveToggle" checked>
        </div>
    </div>

    <div class="app-container" id="appContainer">
        <a href="https://www.facebook.com/" target="_blank" class="app-item">
            <img src="https://upload.wikimedia.org/wikipedia/commons/b/b9/2023_Facebook_icon.svg" alt="Facebook">
            <span>Facebook</span>
        </a>

        <a href="https://www.facebook.com/messages" target="_blank" class="app-item">
            <img src="https://upload.wikimedia.org/wikipedia/commons/b/be/Facebook_Messenger_logo_2020.svg" alt="Messenger">
            <span>Messenger</span>
        </a>

        <a href="https://www.google.com/" target="_blank" class="app-item">
            <img src="https://upload.wikimedia.org/wikipedia/commons/e/e1/Google_Chrome_icon_%28February_2022%29.svg" alt="Chrome">
            <span>Chrome</span>
        </a>

        <a href="https://m.tiktok.com/" target="_blank" class="app-item">
            <img src="https://cdn-icons-png.flaticon.com/512/3046/3046125.png" alt="TikTok" style="background-color: black;">
            <span>TikTok</span>
        </a>

        <a href="https://mastergyi11.github.io/beeai/" target="_blank" class="app-item">
            <img src="https://klay91680-glitch.github.io/beechataiicon/ic_launcher_round.png" alt="BeeChat AI" style="background-color: black;">
            <span>BeeChat AI</span>
        </a>

        <a href="https://mastergyi11.github.io/chat/" target="_blank" class="app-item">
            <img src="https://klay91680-glitch.github.io/beechatsocial-png/ic_launcher.png" alt="Beechat Social" style="background-color: #ffcc00;">
            <span>Beechat Social</span>
        </a>
    </div>

    <!-- Widgets အပိုင်း -->
    <div class="widgets-container">
        <!-- ရက်စွဲ အသစ် -->
        <div class="date-container">
            <iframe src="https://klay91680-glitch.github.io/dataday/" scrolling="no"></iframe>
        </div>

        <!-- နာရီ -->
        <div class="clock-container">
            <iframe src="https://klay91680-glitch.github.io/dateclock/" scrolling="no"></iframe>
        </div>
    </div>

    <script>
        const container = document.getElementById('appContainer');
        const items = document.querySelectorAll('.app-item');
        const settingsPanel = document.getElementById('settingsPanel');
        
        function toggleSettings() {
            settingsPanel.style.display = (settingsPanel.style.display === 'none' || settingsPanel.style.display === '') ? 'block' : 'none';
        }

        function changeIconSize(val) {
            document.getElementById('iconSizeVal').innerText = val;
            items.forEach(item => {
                const img = item.querySelector('img');
                img.style.width = val + 'px';
                img.style.height = val + 'px';
            });
            localStorage.setItem('iconSize', val);
        }

        function changeTextSize(val) {
            document.getElementById('textSizeVal').innerText = val;
            items.forEach(item => {
                const span = item.querySelector('span');
                span.style.fontSize = val + 'px';
            });
            localStorage.setItem('textSize', val);
        }

        function loadSettings() {
            const savedIconSize = localStorage.getItem('iconSize');
            const savedTextSize = localStorage.getItem('textSize');
            if (savedIconSize) {
                document.getElementById('iconSize').value = savedIconSize;
                changeIconSize(savedIconSize);
            }
            if (savedTextSize) {
                document.getElementById('textSize').value = savedTextSize;
                changeTextSize(savedTextSize);
            }
        }

        function saveOrder() {
            if (!document.getElementById('saveToggle').checked) return;
            const order = Array.from(container.children).map(item => item.getAttribute('href'));
            localStorage.setItem('appOrder', JSON.stringify(order));
        }

        function loadOrder() {
            const savedOrder = JSON.parse(localStorage.getItem('appOrder'));
            if (savedOrder && document.getElementById('saveToggle').checked) {
                savedOrder.forEach(href => {
                    const item = container.querySelector(`[href="${href}"]`);
                    if (item) container.appendChild(item);
                });
            }
        }

        loadSettings();
        loadOrder();

        let draggedItem = null;
        let startX, startY;
        let isDragging = false;
        let touchTimer = null;

        items.forEach(item => {
            item.addEventListener('touchstart', function(e) {
                draggedItem = this;
                const touch = e.touches[0];
                startX = touch.clientX;
                startY = touch.clientY;
                isDragging = false;
                touchTimer = setTimeout(() => {
                    if(!isDragging) draggedItem.classList.add('dragging');
                }, 100); 
            }, { passive: true });

            item.addEventListener('touchmove', function(e) {
                if (!draggedItem) return;
                const touch = e.touches[0];
                if (Math.abs(touch.clientX - startX) > 10 || Math.abs(touch.clientY - startY) > 10) {
                    isDragging = true;
                    clearTimeout(touchTimer); 
                    draggedItem.classList.add('dragging'); 
                    e.preventDefault(); 
                    const el = document.elementFromPoint(touch.clientX, touch.clientY);
                    if (el) {
                        const target = el.closest('.app-item');
                        if (target && target !== draggedItem) {
                            const rect = target.getBoundingClientRect();
                            const next = (touch.clientY - rect.top) / (rect.bottom - rect.top) > 0.5;
                            container.insertBefore(draggedItem, next ? target.nextSibling : target);
                        }
                    }
                }
            }, { passive: false });

            item.addEventListener('touchend', function(e) {
                clearTimeout(touchTimer);
                if (draggedItem) {
                    draggedItem.classList.remove('dragging');
                    if (isDragging) {
                        saveOrder(); 
                        e.preventDefault(); 
                    }
                    draggedItem = null;
                }
            });

            item.addEventListener('click', function(e) {
                if (isDragging) {
                    e.preventDefault();
                    isDragging = false;
                }
            });
            item.addEventListener('contextmenu', (e) => e.preventDefault());
        });
    </script>
</body>
</html>
