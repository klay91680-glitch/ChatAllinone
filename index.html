<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Apps</title>
    <style>
        body {
            margin: 0;
            padding: 40px 20px;
            background: linear-gradient(to bottom, #2b2b52, #6a5acd, #b08d9e); 
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
            user-select: none; 
            -webkit-user-select: none;
            touch-action: none; 
        }

        .app-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr); 
            gap: 25px 15px; 
            width: 100%;
            max-width: 350px;
            /* အိုင်ကွန်တွေ နေရာရွှေ့တဲ့အခါ သူတို့ရဲ့ နေရာလွတ်တွေကို မှတ်ထားဖို့ */
            position: relative;
        }

        .app-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none; 
            transition: transform 0.2s;
            cursor: grab; 
            position: relative;
            z-index: 1;
        }

        .app-item:active {
            cursor: grabbing;
        }

        .app-item img {
            width: 70px;
            height: 70px;
            border-radius: 16px; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.3); 
            margin-bottom: 8px;
            background-color: white; 
            object-fit: cover; 
            pointer-events: none; 
            -webkit-touch-callout: none; 
        }

        .app-item span {
            color: white;
            font-size: 13px;
            text-align: center;
            font-weight: 500;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5); 
            pointer-events: none; 
        }

        .dragging {
            opacity: 0.5;
            transform: scale(1.1);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            z-index: 10;
        }
        
        /* ကွက်လပ်နေရာတွေအတွက် (Empty Space) */
        .empty-space {
            width: 70px;
            height: 70px;
            border-radius: 16px;
            border: 2px dashed rgba(255, 255, 255, 0.2); /* ကွက်လပ်ဆိုတာ သိအောင် မျဉ်းပြတ်လေးနဲ့ ပြထားတယ် */
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

    <div class="app-container" id="appContainer">
        
        <!-- ၁။ Facebook -->
        <a href="https://www.facebook.com/" target="_blank" class="app-item">
            <img src="https://upload.wikimedia.org/wikipedia/commons/b/b9/2023_Facebook_icon.svg" alt="Facebook">
            <span>Facebook</span>
        </a>

        <!-- ၂။ Messenger -->
        <a href="https://www.facebook.com/messages" target="_blank" class="app-item">
            <img src="https://upload.wikimedia.org/wikipedia/commons/b/be/Facebook_Messenger_logo_2020.svg" alt="Messenger">
            <span>Messenger</span>
        </a>

        <!-- ၃။ Chrome -->
        <a href="https://www.google.com/" target="_blank" class="app-item">
            <img src="https://upload.wikimedia.org/wikipedia/commons/e/e1/Google_Chrome_icon_%28February_2022%29.svg" alt="Chrome">
            <span>Chrome</span>
        </a>

        <!-- ၄။ TikTok -->
        <a href="https://m.tiktok.com/" target="_blank" class="app-item">
            <img src="https://cdn-icons-png.flaticon.com/512/3046/3046125.png" alt="TikTok" style="background-color: black;">
            <span>TikTok</span>
        </a>

        <!-- ၅။ BeeChat AI -->
        <a href="https://mastergyi11.github.io/beeai/" target="_blank" class="app-item">
            <img src="https://cdn-icons-png.flaticon.com/512/4712/4712035.png" alt="BeeChat AI" style="background-color: black;">
            <span>BeeChat AI</span>
        </a>

        <!-- ၆။ Beechat Social -->
        <a href="https://mastergyi11.github.io/chat/" target="_blank" class="app-item">
            <img src="https://cdn-icons-png.flaticon.com/512/1041/1041916.png" alt="Beechat Social" style="background-color: #ffcc00;">
            <span>Beechat Social</span>
        </a>

        <!-- ကွက်လပ်တွေ ထားချင်ရင် ဒီအောက်မှာ ထည့်နိုင်ပါတယ် -->
        <!-- <div class="empty-space"></div> -->
        <!-- <div class="empty-space"></div> -->

    </div>

    <script>
        const container = document.getElementById('appContainer');
        const items = document.querySelectorAll('.app-item');

        function saveOrder() {
            const order = Array.from(container.children).map(item => {
                if(item.classList.contains('app-item')) {
                    return item.getAttribute('href');
                } else {
                    return 'EMPTY'; // ကွက်လပ်ဖြစ်နေရင် EMPTY လို့ သိမ်းမယ်
                }
            });
            localStorage.setItem('appOrder', JSON.stringify(order));
        }

        function loadOrder() {
            const savedOrder = JSON.parse(localStorage.getItem('appOrder'));
            if (savedOrder) {
                savedOrder.forEach(href => {
                    if (href !== 'EMPTY') {
                        const item = container.querySelector(`[href="${href}"]`);
                        if (item) container.appendChild(item);
                    } else {
                        // ကွက်လပ်ဖြစ်နေရင် ကွက်လပ်အကွက်လေး ပြန်ထည့်မယ်
                        const emptyDiv = document.createElement('div');
                        emptyDiv.className = 'empty-space';
                        container.appendChild(emptyDiv);
                    }
                });
            }
        }
        loadOrder();

        let draggedItem = null;
        let startX, startY;
        let isDragging = false;
        let touchTimer = null;

        items.forEach(item => {
            item.addEventListener('touchstart', function(e) {
                draggedItem = this;
                const touch = e.touches[0];
                startX = touch.clientX;
                startY = touch.clientY;
                isDragging = false;
                
                touchTimer = setTimeout(() => {
                    if(!isDragging) draggedItem.classList.add('dragging');
                }, 100); 
            }, { passive: true });

            item.addEventListener('touchmove', function(e) {
                if (!draggedItem) return;
                
                const touch = e.touches[0];
                const diffX = Math.abs(touch.clientX - startX);
                const diffY = Math.abs(touch.clientY - startY);

                if (diffX > 10 || diffY > 10) {
                    isDragging = true;
                    clearTimeout(touchTimer); 
                    draggedItem.classList.add('dragging'); 
                    e.preventDefault(); 

                    const elementUnderFinger = document.elementFromPoint(touch.clientX, touch.clientY);
                    if (elementUnderFinger) {
                        const targetItem = elementUnderFinger.closest('.app-item, .empty-space');
                        if (targetItem && targetItem !== draggedItem) {
                            // ကွက်လပ်နေရာကို ဆွဲချရင် အဲဒီနေရာမှာ ထားမယ်
                            const rect = targetItem.getBoundingClientRect();
                            const next = (touch.clientY - rect.top) / (rect.bottom - rect.top) > 0.5;
                            container.insertBefore(draggedItem, next ? targetItem.nextSibling : targetItem);
                        }
                    }
                }
            }, { passive: false });

            item.addEventListener('touchend', function(e) {
                clearTimeout(touchTimer);
                if (draggedItem) {
                    draggedItem.classList.remove('dragging');
                    if (isDragging) {
                        saveOrder(); 
                        e.preventDefault(); 
                    }
                    draggedItem = null;
                }
            });

            item.addEventListener('click', function(e) {
                if (isDragging) {
                    e.preventDefault();
                    isDragging = false;
                }
            });
            
            item.addEventListener('contextmenu', function(e) {
                e.preventDefault();
            });
        });
    </script>
</body>
    </html>
